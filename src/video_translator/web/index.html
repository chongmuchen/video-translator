<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Video Translator</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f4ef;
      color: #20201d;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 48px 20px; }
    main { max-width: 760px; margin: 0 auto; }
    h1 { font-size: clamp(34px, 6vw, 58px); margin: 0 0 8px; letter-spacing: -2px; }
    .subtitle { color: #69675f; margin: 0 0 32px; font-size: 17px; }
    .card {
      background: white;
      border: 1px solid #deddd5;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 18px 60px rgba(34, 33, 28, .06);
    }
    label { display: block; font-weight: 650; margin-bottom: 8px; }
    input[type=url] {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #cbc9bf;
      border-radius: 11px;
      font-size: 16px;
      outline: none;
    }
    input[type=url]:focus { border-color: #315c4b; box-shadow: 0 0 0 3px #dce9e2; }
    .checks { display: flex; gap: 20px; margin: 18px 0; flex-wrap: wrap; }
    .checks label { font-weight: 500; margin: 0; }
    button, .download {
      border: 0;
      border-radius: 11px;
      background: #315c4b;
      color: white;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 650;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    button:disabled { opacity: .55; cursor: wait; }
    #status { display: none; margin-top: 22px; border-top: 1px solid #ecebe5; padding-top: 20px; }
    .status-line { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 9px; }
    .bar { height: 10px; border-radius: 20px; background: #e8e6de; overflow: hidden; }
    .bar > div { height: 100%; width: 0; background: #d66b3d; transition: width .4s ease; }
    #error { color: #a9332d; white-space: pre-wrap; margin-top: 14px; }
    #result { margin-top: 16px; }
    .notice { color: #77746c; font-size: 13px; line-height: 1.6; margin: 18px 4px 0; }
  </style>
</head>
<body>
  <main>
    <h1>Video Translator</h1>
    <p class="subtitle">从视频链接到中文配音、字幕和双音轨 MP4。</p>
    <section class="card">
      <form id="job-form">
        <label for="url">YouTube 或 B站视频链接</label>
        <input id="url" type="url" required
               placeholder="https://www.youtube.com/watch?v=...">
        <div class="checks">
          <label><input id="original" type="checkbox" checked> 保留原声音轨</label>
          <label><input id="burn" type="checkbox"> 烧录中文字幕</label>
        </div>
        <button id="submit" type="submit">开始翻译</button>
      </form>
      <div id="status">
        <div class="status-line">
          <strong id="message">等待处理</strong>
          <span id="progress">0%</span>
        </div>
        <div class="bar"><div id="bar"></div></div>
        <div id="error"></div>
        <div id="result"></div>
      </div>
    </section>
    <p class="notice">
      仅处理你拥有版权、已获授权，或依法允许下载和制作翻译版本的内容。
      登录或受限内容需要在服务端单独配置 Cookies。
    </p>
  </main>
  <script>
    const form = document.querySelector("#job-form");
    const submit = document.querySelector("#submit");
    const statusBox = document.querySelector("#status");
    const message = document.querySelector("#message");
    const progress = document.querySelector("#progress");
    const bar = document.querySelector("#bar");
    const errorBox = document.querySelector("#error");
    const result = document.querySelector("#result");

    const showJob = (job) => {
      const value = job.progress || 0;
      message.textContent = job.stage_message || job.status;
      progress.textContent = `${value}%`;
      bar.style.width = `${value}%`;
      errorBox.textContent = job.error || "";
      if (job.download_ready) {
        result.innerHTML = `<a class="download" href="/api/jobs/${job.id}/download">下载中文配音视频</a>`;
      }
    };

    const poll = async (id) => {
      while (true) {
        const response = await fetch(`/api/jobs/${id}`);
        const job = await response.json();
        showJob(job);
        if (job.status === "completed" || job.status === "failed") {
          submit.disabled = false;
          return;
        }
        await new Promise(resolve => setTimeout(resolve, 2000));
      }
    };

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      submit.disabled = true;
      statusBox.style.display = "block";
      errorBox.textContent = "";
      result.innerHTML = "";
      const payload = {
        url: document.querySelector("#url").value,
        options: {
          target_language: "简体中文",
          keep_original_audio: document.querySelector("#original").checked,
          burn_subtitles: document.querySelector("#burn").checked
        }
      };
      try {
        const response = await fetch("/api/jobs", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "创建任务失败");
        showJob(data);
        await poll(data.id);
      } catch (error) {
        errorBox.textContent = error.message;
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
